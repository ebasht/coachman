<!DOCTYPE html>
<html lang="ru" class="is-booting" style="background:#070d1a">
  <head>
    <meta charset="UTF-8" />
    <!-- Critical boot paint FIRST — before fonts / theme / any network. Navy matches PWA background_color. -->
    <meta name="theme-color" content="#070d1a" />
    <style>
      html, body {
        margin: 0;
        font-family: Unbounded, Manrope, system-ui, -apple-system, sans-serif;
        height: 100%;
        overflow: hidden;
      }
      /* Navy from the first pixel; removed with .is-booting after splash fade */
      html.is-booting,
      html.is-booting body {
        background: #070d1a !important;
        color: #f3e7c2;
      }
      /* Boot splash before React / JS — self-contained, no external CSS */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
        background:
          radial-gradient(90% 70% at 18% 12%, rgba(201, 164, 74, 0.16) 0%, transparent 55%),
          radial-gradient(80% 60% at 92% 88%, rgba(70, 110, 180, 0.22) 0%, transparent 50%),
          linear-gradient(165deg, #101a2e 0%, #070d1a 48%, #050810 100%);
        transition: opacity 0.32s ease, visibility 0.32s ease;
      }
      #root {
        position: relative;
        z-index: 0;
        height: 100%;
      }
      #boot-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash .boot-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      #boot-splash .boot-mark-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 1.35rem;
      }
      #boot-splash .boot-mark {
        display: block;
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: #0a1224;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(201, 164, 74, 0.18);
        animation: boot-breathe 2.8s ease-in-out infinite;
      }
      #boot-splash .boot-ring {
        position: absolute;
        inset: -10px;
        border-radius: 30px;
        border: 1.5px solid rgba(201, 164, 74, 0.45);
        animation: boot-ring 2.4s ease-out infinite;
        pointer-events: none;
      }
      #boot-splash .boot-ring-delay { animation-delay: 1.2s; }
      #boot-splash .boot-brand {
        margin: 0 0 1.15rem;
        font-size: clamp(1.85rem, 7vw, 2.45rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
        color: #f3e7c2;
      }
      #boot-splash .boot-dots {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        justify-content: center;
        min-height: 0.65rem;
      }
      #boot-splash .boot-dots span {
        display: block;
        flex: 0 0 auto;
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 50%;
        background: #c9a44a;
        box-shadow: 0 0 12px rgba(201, 164, 74, 0.45);
        animation: boot-dot 1.15s ease-in-out infinite;
      }
      #boot-splash .boot-dots span:nth-child(2) { animation-delay: 0.16s; }
      #boot-splash .boot-dots span:nth-child(3) { animation-delay: 0.32s; }
      @keyframes boot-breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes boot-ring {
        0% { opacity: 0.65; transform: scale(0.92); }
        100% { opacity: 0; transform: scale(1.28); }
      }
      @keyframes boot-dot {
        0%, 80%, 100% { opacity: 0.35; transform: translateY(0) scale(0.85); }
        40% { opacity: 1; transform: translateY(-5px) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-mark,
        #boot-splash .boot-ring,
        #boot-splash .boot-dots span { animation: none; }
      }
    </style>
    <!-- Do NOT use viewport-fit=cover — on iPhone it recreates a huge white gap under compose.
         resizes-visual: keyboard shrinks visualViewport; JS sizes .app to top+height. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
    <!-- Android Capacitor: viewport-fit=cover before SystemBars reads the meta (iOS stays without it). -->
    <script>
      (function () {
        try {
          var cap = window.Capacitor;
          var android =
            (cap && typeof cap.getPlatform === 'function' && cap.getPlatform() === 'android') ||
            (/Android/i.test(navigator.userAgent) && /; wv\)/i.test(navigator.userAgent));
          if (!android) return;
          document.documentElement.classList.add('native-android');
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta && meta.content && meta.content.indexOf('viewport-fit') === -1) {
            meta.content += ', viewport-fit=cover';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('coachman_theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          // Keep browser chrome navy while .is-booting; theme.ts restores after splash.
        } catch (e) {}
      })();
    </script>
