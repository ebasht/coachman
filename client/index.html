<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Do NOT use viewport-fit=cover — on iPhone it recreates a huge white gap under compose.
         resizes-visual: keyboard shrinks visualViewport; JS sizes .app to top+height. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
    <!-- Android Capacitor: viewport-fit=cover before SystemBars reads the meta (iOS stays without it). -->
    <script>
      (function () {
        try {
          var cap = window.Capacitor;
          var android =
            (cap && typeof cap.getPlatform === 'function' && cap.getPlatform() === 'android') ||
            (/Android/i.test(navigator.userAgent) && /; wv\)/i.test(navigator.userAgent));
          if (!android) return;
          document.documentElement.classList.add('native-android');
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta && meta.content && meta.content.indexOf('viewport-fit') === -1) {
            meta.content += ', viewport-fit=cover';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('coachman_theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var color = dark ? '#0b0b0f' : '#ffffff';
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', color);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Ямщик — защищённый мессенджер на вашем сервере. Приватные чаты, видеозвонки и совместные списки без зависимости от централизованных платформ." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="/app-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png" />
    <link rel="apple-touch-icon" href="/app-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ямщик" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Ямщик</title>
    <!-- SW registration lives in main.tsx (vite-plugin-pwa). Inline script would break CSP. -->
    <style>
      html, body {
        margin: 0;
        background: #ffffff;
        color: #000000;
        font-family: Unbounded, Manrope, system-ui, -apple-system, sans-serif;
        height: 100%;
        overflow: hidden;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background: #0b0b0f;
        color: #f2f2f7;
      }
      /* Boot splash before React paints — mirrors .app-preloader */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
        background:
          radial-gradient(90% 70% at 18% 12%, rgba(201, 164, 74, 0.16) 0%, transparent 55%),
          radial-gradient(80% 60% at 92% 88%, rgba(70, 110, 180, 0.22) 0%, transparent 50%),
          linear-gradient(165deg, #101a2e 0%, #070d1a 48%, #050810 100%);
        transition: opacity 0.32s ease, visibility 0.32s ease;
      }
      #root {
        position: relative;
        z-index: 0;
        height: 100%;
      }
      #boot-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash .boot-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      #boot-splash .boot-mark-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 1.35rem;
      }
      #boot-splash .boot-mark {
        display: block;
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(201, 164, 74, 0.18);
        animation: boot-breathe 2.8s ease-in-out infinite;
      }
      #boot-splash .boot-ring {
        position: absolute;
        inset: -10px;
        border-radius: 30px;
        border: 1.5px solid rgba(201, 164, 74, 0.45);
        animation: boot-ring 2.4s ease-out infinite;
        pointer-events: none;
      }
      #boot-splash .boot-ring-delay { animation-delay: 1.2s; }
      #boot-splash .boot-brand {
        margin: 0 0 1.15rem;
        font-size: clamp(1.85rem, 7vw, 2.45rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
        color: #f3e7c2;
      }
      #boot-splash .boot-dots {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        justify-content: center;
      }
      #boot-splash .boot-dots span {
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 50%;
        background: #c9a44a;
        animation: boot-dot 1.15s ease-in-out infinite;
      }
      #boot-splash .boot-dots span:nth-child(2) { animation-delay: 0.16s; }
      #boot-splash .boot-dots span:nth-child(3) { animation-delay: 0.32s; }
      @keyframes boot-breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes boot-ring {
        0% { opacity: 0.65; transform: scale(0.92); }
        100% { opacity: 0; transform: scale(1.28); }
      }
      @keyframes boot-dot {
        0%, 80%, 100% { opacity: 0.35; transform: translateY(0) scale(0.85); }
        40% { opacity: 1; transform: translateY(-5px) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-mark,
        #boot-splash .boot-ring,
        #boot-splash .boot-dots span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-busy="true" aria-label="Загрузка">
      <div class="boot-stage">
        <div class="boot-mark-wrap">
          <span class="boot-ring" aria-hidden="true"></span>
          <span class="boot-ring boot-ring-delay" aria-hidden="true"></span>
          <img class="boot-mark" src="/app-icon-192.png" alt="" width="96" height="96" />
        </div>
        <p class="boot-brand">Ямщик</p>
        <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
